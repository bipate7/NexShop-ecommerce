<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | NexShop</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="External_Css/Style.css" />
    <link rel="stylesheet" href="External_Css/utilities.css" />
  </head>
  <body>
    <header id="site-header"></header>

    <main id="main-content" class="container my-5">
      <h1>Checkout</h1>
      <form class="mt-4">
        <div class="mb-3">
          <label for="full-name" class="form-label">Full name</label>
          <input
            id="full-name"
            name="fullName"
            type="text"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input
            id="address"
            name="address"
            type="text"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="card-details" class="form-label">Card details</label>
          <input
            id="card-details"
            name="cardDetails"
            type="text"
            class="form-control"
            required
          />
        </div>
        <button class="btn btn-success" type="submit">Place order</button>
      </form>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/templates.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/checkout.js" defer></script>
  </body>
</html>
